{% extends "base.html" %}{% block content %}<div class="page-head"><span class="eyebrow">RESULTS</span><h1>Election results</h1><p>Total votes recorded: <b>{{total}}</b> • Registered students: <b>{{registered}}</b></p></div>{% for p in posts %}<section class="panel"><h2>{{p.name}}</h2><div class="result-list">{% for r in data[p.id] %}<div class="result"><div><b>{{r.name}}</b><small>{{r.class_name}}</small></div><strong>{{r.votes}}</strong></div>{% endfor %}</div></section>{% endfor %}{% endblock %}
