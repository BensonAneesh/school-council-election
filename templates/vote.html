{% extends "base.html" %}{% block content %}<div class="page-head"><span class="eyebrow">SECURE VOTING</span><h1>Cast your vote</h1><p>Use your approved school details. You can choose one candidate for each post.</p></div><form method="post" class="vote-form"><section class="panel"><h2>Student details</h2><div class="form-grid"><label>Name<input name="name" required></label><label>Admission number<input name="admission_number" required></label><label>Class<input name="class_name" required></label></div></section>{% for p in posts %}<section class="panel"><h2>{{p.name}}</h2><div class="choice-grid">{% for c in candidates[p.id] %}<label class="choice"><input type="radio" name="post_{{p.id}}" value="{{c.id}}" required>{% if c.photo %}<img src="{{url_for('static',filename='uploads/'+c.photo)}}">{% endif %}<span><b>{{c.name}}</b><small>{{c.class_name}}</small></span></label>{% endfor %}</div></section>{% endfor %}<button class="btn wide" type="submit">Review my vote</button></form>{% endblock %}
